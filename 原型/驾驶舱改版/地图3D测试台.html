<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区县 3D 立体地图 · 独立测试台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080f;--panel:#0a1a2c;--line:#1c3d58;--line-2:#2a5273;
  --ink:#e9f4ff;--ink-2:#c2d8ec;--muted:#8fa9c2;
  --accent:#5fd8ff;--accent-2:#8de5ff;--good:#45db83;--warn:#f0b455;--bad:#ff5f70;
  --font-cn:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-cn);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding:16px;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1000px 480px at 60% -6%,rgba(20,54,90,.6),transparent 62%),
    linear-gradient(90deg,rgba(77,131,169,.07) 0 1px,transparent 1px 64px),
    linear-gradient(0deg,rgba(77,131,169,.07) 0 1px,transparent 1px 64px);
}
.app{position:relative;z-index:1;display:grid;grid-template-columns:296px minmax(0,1fr);gap:14px;height:calc(100dvh - 32px)}

/* ---------- 控制面板 ---------- */
.panel{border:1px solid rgba(111,198,255,.26);border-radius:10px;overflow:auto;padding:13px 14px;
  background:linear-gradient(165deg,rgba(17,44,72,.62),rgba(8,22,38,.58));
  backdrop-filter:blur(13px) saturate(128%);box-shadow:0 12px 30px rgba(0,0,0,.42),inset 0 1px rgba(200,235,255,.16)}
.panel h1{font-size:15px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.panel h1::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px rgba(95,216,255,.9)}
.panel .sub{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.grp{border-top:1px solid rgba(111,198,255,.16);padding-top:11px;margin-top:11px}
.grp:first-of-type{border-top:0;padding-top:0;margin-top:0}
.grp-t{font-size:10.5px;letter-spacing:.14em;color:#6f92b4;margin-bottom:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.row label{font-size:12px;color:var(--ink-2)}
select,input[type=number],input[type=text]{
  background:#0b2034;color:var(--ink);border:1px solid rgba(111,198,255,.3);border-radius:6px;
  padding:5px 8px;font-size:12px;font-family:inherit;min-width:104px;outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,216,255,.14)}
input[type=range]{width:118px;accent-color:#5fd8ff;height:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer;padding:3px 0}
.chk input{appearance:none;width:15px;height:15px;border-radius:4px;border:1px solid rgba(111,198,255,.42);
  background:#0b2034;position:relative;cursor:pointer;flex:none}
.chk input:checked{background:linear-gradient(160deg,#5fd8ff,#2b7bb8);border-color:#8de5ff}
.chk input:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid #06121f;border-width:0 2px 2px 0;transform:rotate(42deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;height:30px;margin-top:6px;
  border:1px solid rgba(111,198,255,.34);border-radius:7px;background:linear-gradient(180deg,rgba(18,42,68,.72),rgba(8,20,34,.6));
  color:#bdd4e8;font-size:12px;cursor:pointer;font-family:inherit;transition:.18s}
.btn:hover{color:#fff;border-color:rgba(141,229,255,.8);box-shadow:0 0 16px rgba(95,216,255,.26)}
.btn.ghost{background:transparent}
.dist-table{display:grid;gap:6px;margin-top:4px}
.dist-row{display:grid;grid-template-columns:1fr 60px auto;align-items:center;gap:8px;font-size:12px}
.dist-row span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist-row .h{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.dist-row input[type=number]{width:60px;padding:3px 6px;font-family:var(--mono);text-align:right}

/* ---------- 舞台 ---------- */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-width:0;min-height:0}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid rgba(111,198,255,.22);border-radius:10px;padding:9px 15px;
  background:linear-gradient(96deg,rgba(16,40,64,.7),rgba(11,28,46,.6));backdrop-filter:blur(12px)}
.stage-head h2{font-size:16px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:9px}
.stage-head h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px rgba(95,216,255,.9)}
.stage-head .meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:14px}
.stage-head .meta b{font-family:var(--mono);color:var(--ink-2);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-size:11.5px;
  background:rgba(95,216,255,.12);border:1px solid rgba(95,216,255,.34);color:var(--accent-2)}

.map-wrap{position:relative;min-height:0;border:1px solid rgba(111,198,255,.26);border-radius:10px;overflow:hidden;
  background:radial-gradient(75% 85% at 50% 58%,rgba(14,48,82,.5),rgba(4,13,24,.88) 74%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.72),inset 0 1px rgba(200,235,255,.12);
  perspective:1600px;perspective-origin:50% 42%}
.map-scene{position:absolute;inset:0}
.map-scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.radar{position:absolute;left:50%;top:48%;width:0;height:0;z-index:0;pointer-events:none}
.radar i{position:absolute;border-radius:50%;border:1px dashed rgba(95,216,255,.2);
  width:880px;height:880px;margin:-440px 0 0 -440px;animation:spin 64s linear infinite}
.radar i:nth-child(2){width:650px;height:650px;margin:-325px 0 0 -325px;animation-duration:48s;animation-direction:reverse;border-color:rgba(95,216,255,.16)}
.radar i:nth-child(3){width:420px;height:420px;margin:-210px 0 0 -210px;animation-duration:32s;border-style:solid;border-color:rgba(95,216,255,.13)}
.radar .beam{position:absolute;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(95,216,255,.26),rgba(95,216,255,.05) 22%,#0000 32%);
  animation:spin 13s linear infinite;filter:blur(7px)}
@keyframes spin{to{transform:rotate(360deg)}}
.podium{position:absolute;left:50%;top:52%;width:0;height:0;z-index:0;perspective:900px}
.podium i{position:absolute;width:1500px;height:1500px;margin:-750px 0 0 -750px;
  transform:rotateX(80deg) translateZ(-10px);border-radius:50%;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(95,216,255,.14) 0 1px,transparent 1px 58px),
    repeating-linear-gradient(90deg,rgba(95,216,255,.14) 0 1px,transparent 1px 58px),
    repeating-radial-gradient(circle,rgba(95,216,255,.16) 0 1px,transparent 1px 88px),
    radial-gradient(closest-side,rgba(52,170,245,.3),transparent 70%);
  filter:blur(.4px);box-shadow:0 0 90px rgba(95,216,255,.22),inset 0 0 120px rgba(95,216,255,.18);
  -webkit-mask-image:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.5) 40%,transparent 70%);
  mask-image:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.5) 40%,transparent 70%)}
.pillar{position:absolute;left:50%;top:0;width:0;height:0;z-index:1;pointer-events:none}
.pillar i{position:absolute;width:420px;height:760px;margin-left:-210px;
  background:radial-gradient(ellipse 34% 52% at 50% 96%,rgba(95,216,255,.2),rgba(95,216,255,.04) 58%,#0000 78%);
  filter:blur(26px)}
.scan{position:absolute;left:50%;top:52%;width:0;height:0;z-index:0;perspective:800px;pointer-events:none}
.scan i{position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;
  transform:rotateX(84deg);background:radial-gradient(closest-side,#0000 62%,rgba(95,216,255,.5) 78%,#0000 88%);
  animation:scan 3.4s ease-out infinite}
.scan i:nth-child(2){animation-delay:-1.13s}
.scan i:nth-child(3){animation-delay:-2.26s}
@keyframes scan{0%{transform:rotateX(84deg) scale(.24);opacity:0}18%{opacity:.8}100%{transform:rotateX(84deg) scale(1.5);opacity:0}}

.dnum-badge{font-family:var(--mono);font-size:13px;font-weight:600;fill:#eaf7ff;pointer-events:none;text-anchor:middle;
  filter:drop-shadow(0 0 6px rgba(141,229,255,.8))}
.dname{font-family:var(--font-cn);font-size:10.5px;fill:#e2f1ff;pointer-events:none;text-anchor:middle;
  paint-order:stroke;stroke:rgba(3,12,22,.9);stroke-width:3px;stroke-linejoin:round}
.district{cursor:pointer}
.district.on{stroke:#eaf8ff;stroke-width:2.2}
.face.on{filter:url(#glowOn)}

.legend{position:absolute;left:12px;top:12px;z-index:4;background:rgba(7,22,38,.74);border:1px solid rgba(111,198,255,.34);
  border-radius:8px;padding:9px 11px;backdrop-filter:blur(9px);min-width:132px}
.legend .lg-hd{font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.legend .lg{display:grid;gap:5px;font-size:11.5px;color:var(--ink-2)}
.legend .lg div{display:flex;align-items:center;gap:8px}
.legend .lg i{width:12px;height:9px;border-radius:2px;flex:none}
.legend .lg b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--ink)}
.note{position:absolute;right:12px;bottom:12px;z-index:4;font-size:10.5px;color:var(--muted);text-align:right;line-height:1.7;
  background:rgba(7,22,38,.6);border:1px solid rgba(111,198,255,.2);border-radius:8px;padding:7px 10px}

.readout{border:1px solid rgba(111,198,255,.24);border-radius:10px;padding:10px 14px;
  background:linear-gradient(96deg,rgba(14,36,58,.7),rgba(8,22,36,.62));backdrop-filter:blur(12px);
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.readout div{display:grid;gap:2px;min-width:0}
.readout .k{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readout .v{font-family:var(--mono);font-size:16px;font-weight:600;color:#eaf7ff}
.readout .v.hot{color:var(--bad)}
.readout .u{font-size:10px;color:var(--muted)}
@media (max-width:1200px){ .app{grid-template-columns:1fr;height:auto} body{overflow:auto} .readout{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){ .radar i,.radar .beam,.scan i{animation:none!important} }
</style>
</head>
<body>
<div class="app">

  <aside class="panel">
    <h1>3D 立体地图测试台</h1>
    <p class="sub">真实衢州底图（CTAmap v2.0 离线投影），可调测高口径、浮起倍率、视角与图层开关。</p>

    <div class="grp">
      <div class="grp-t">测高口径</div>
      <div class="row"><label for="metric">高度依据</label>
        <select id="metric">
          <option value="index">综合风险指数</option>
          <option value="hazards">未销项隐患</option>
          <option value="overdue">已逾期</option>
          <option value="high">高风险隐患</option>
          <option value="pending">待监管复核</option>
        </select></div>
      <div class="row"><label for="scale">高度倍率</label><input type="range" id="scale" min="0" max="80" value="34"></div>
      <div class="row"><label for="mode">配色</label>
        <select id="mode">
          <option value="risk">风险色（红/琥珀/蓝）</option>
          <option value="mono">单色蓝阶</option>
          <option value="height">按高度渐变</option>
        </select></div>
    </div>

    <div class="grp">
      <div class="grp-t">视角</div>
      <div class="row"><label for="tilt">俯仰角</label>
        <select id="tilt">
          <option value="0">正俯视（0°）</option>
          <option value="26">斜俯视（26°）</option>
          <option value="42">斜视（42°）</option>
          <option value="54">侧视（54°）</option>
          <option value="66">近侧视（66°）</option>
          <option value="78">平侧视（78°）</option>
        </select></div>
      <div class="row"><label for="yaw">方位角</label><input type="range" id="yaw" min="-45" max="45" value="-18"></div>
      <div class="row"><label for="dir">浮起方向</label>
        <select id="dir"><option value="up">向上</option><option value="down">向下（负高度）</option></select></div>
    </div>

    <div class="grp">
      <div class="grp-t">图层开关</div>
      <label class="chk"><input type="checkbox" id="layBase" checked>底座与挤出侧壁</label>
      <label class="chk"><input type="checkbox" id="layBadge" checked>3D 数字牌</label>
      <label class="chk"><input type="checkbox" id="layName" checked>区县名</label>
      <label class="chk"><input type="checkbox" id="layBeam" checked>高亮区光柱</label>
      <label class="chk"><input type="checkbox" id="layRadar" checked>背景雷达环</label>
      <label class="chk"><input type="checkbox" id="layFloor" checked>地面网格</label>
      <label class="chk"><input type="checkbox" id="layGrid" checked>底图网格</label>
    </div>

    <div class="grp">
      <div class="grp-t">测试数据（每区测高值）</div>
      <div class="dist-table" id="distTable"></div>
      <button class="btn" id="btnRandom" type="button">随机生成</button>
      <button class="btn ghost" id="btnReset" type="button">复位真实数据</button>
      <button class="btn ghost" id="btnCopy" type="button">复制当前配置</button>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-head">
      <h2>浙江省衢州市 · 区县风险立体地形</h2>
      <div class="meta">
        <span class="badge" id="tiltBadge">正视</span>
        <span>高度依据 <b id="metricName">综合风险指数</b></span>
        <span>倍率 <b id="scaleName">1.6</b></span>
        <span>最高 <b id="maxName">柯城区</b></span>
      </div>
    </div>

    <div class="map-wrap" id="mapWrap">
      <div class="map-scene" id="mapScene">
        <div class="radar" id="radar"><i></i><i></i><i></i><span class="beam"></span></div>
        <div class="pillar" id="pillar"><i></i></div>
        <svg id="mapSvg" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="legend">
        <div class="lg-hd" id="legendTitle">风险指数</div>
        <div class="lg" id="legendBox"></div>
      </div>
      <div class="note">底图 CTAmap v2.0 · 离线投影<br>高度 = 指标值 × 倍率（0–100 口径）<br>点击区县可高亮，悬停查看读数</div>
    </div>

    <div class="readout" id="readout"></div>
  </main>
</div>

/* ==================== 3D 地图渲染核心 ==================== */
/* 真实三维投影：平面坐标 (x,y) + 高度 z，经方位角 yaw + 俯仰角 tilt + 透视投影到屏幕。
   相机从南侧偏西上方看向场景，屏幕上方为北。
   - 俯仰角 tilt：0° = 正俯视，90° = 纯侧视
   - 方位角 yaw：绕垂直轴旋转，>0 时相机向西偏
   - 可见性：外法线与相机水平方位同向的墙面才可见 */

function makeMapCamera(cam, plan) {
  const rad = d => d * Math.PI / 180;
  const ct = Math.cos(rad(cam.tilt)), st = Math.sin(rad(cam.tilt));
  const cb = Math.cos(rad(cam.yaw)), sb = Math.sin(rad(cam.yaw));
  const D = cam.focal, cx = plan.cx, cy = plan.cy;
  return {
    camDir: { x: sb, y: cb },
    P(x, y, z) {
      const x0 = x - cx, y0 = y - cy;
      const x1 = x0 * cb - y0 * sb, y1 = x0 * sb + y0 * cb;
      const sx = x1, sy = y1 * ct - z * st;
      const k = y1 * st + z * ct;
      const s = D / (D - k);
      return { x: cx + sx * s, y: cy + sy * s, s };
    },
  };
}

/** 计算平面包围盒与中心 */
function planOf(items) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  items.forEach(it => it.rings.forEach(poly => poly.forEach(ring => ring.forEach(([x, y]) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }))));
  return { minX, maxX, minY, maxY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
}

/** 平面环的有向面积（用于判定绕向，进而定外法线） */
function signedArea(ring) {
  let a = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
    a += x1 * y2 - x2 * y1;
  }
  return a / 2;
}

/**
 * 生成 3D 地图的全部绘制指令。
 * items: [{ name, rings, h, lv, lx, ly }]
 */
function buildMap3D(items, cam, selected) {
  const plan = planOf(items);
  const { P, camDir } = makeMapCamera(cam, plan);
  const ground = [], walls = [], faces = [], edges = [], beams = [], labels = [];
  let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
  const track = p => {
    if (p.x < bx0) bx0 = p.x; if (p.x > bx1) bx1 = p.x;
    if (p.y < by0) by0 = p.y; if (p.y > by1) by1 = p.y;
  };
  const fmt = p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`;

  /* 北侧（y 小）先画，南侧后画，保证遮挡关系 */
  const sorted = items.slice().sort((a, b) => (a.ly ?? 0) - (b.ly ?? 0));

  /* 第一层：真实地平面。全部区县先按 z=0 画出彩色地面，
     凸起的板块随后叠加，这样抬高的方块能正确遮住它北侧的地面。 */
  sorted.forEach(it => {
    it.rings.forEach(poly => {
      const outer = poly[0];
      let dGround = '';
      poly.forEach(ring => {
        dGround += 'M' + ring.map(([x, y]) => { const p = P(x, y, 0); track(p); return fmt(p); }).join('L') + 'Z';
      });
      ground.push({ d: dGround, lv: it.lv, name: it.name, sel: it.name === selected });
    });
  });

  /* 第二层：抬起的立体板块（高度 = 风险） */
  sorted.forEach(it => {
    const h = it.h, lv = it.lv, isSel = it.name === selected;
    it.rings.forEach(poly => {
      const outer = poly[0];

      /* 侧壁：只画朝向相机的边，整区合并为一条路径以消除接缝 */
      let wallPath = '';
      poly.forEach(ring => {
        const sgn = signedArea(ring) > 0 ? 1 : -1;
        for (let i = 0; i < ring.length; i++) {
          const [ax, ay] = ring[i], [bx, by] = ring[(i + 1) % ring.length];
          const nx = sgn * (by - ay), ny = -sgn * (bx - ax);
          if (nx * camDir.x + ny * camDir.y <= 0) continue;
          const t1 = P(ax, ay, h), t2 = P(bx, by, h);
          const b1 = P(bx, by, 0), b2 = P(ax, ay, 0);
          track(t1); track(t2); track(b1); track(b2);
          wallPath += `M${fmt(t1)}L${fmt(t2)}L${fmt(b1)}L${fmt(b2)}Z`;
        }
      });
      if (wallPath && h > 0) walls.push({ d: wallPath, lv, sel: isSel });

      /* 顶面（洞作为子路径，evenodd 填充） */
      let dTop = '';
      poly.forEach(ring => {
        dTop += 'M' + ring.map(([x, y]) => { const p = P(x, y, h); track(p); return fmt(p); }).join('L') + 'Z';
      });
      if (h > 0) faces.push({ d: dTop, lv, name: it.name, sel: isSel });
      if (isSel) {
        const base = 'M' + outer.map(([x, y]) => { const p = P(x, y, 0); return fmt(p); }).join('L') + 'Z';
        edges.push({ d: base, dim: true });
        edges.push({ d: 'M' + outer.map(([x, y]) => { const p = P(x, y, h); return fmt(p); }).join('L') + 'Z' });
      }
    });

    /* 标签：贴在顶面质心上，保持正向可读 */
    const anchor = P(it.lx, it.ly, h);
    track(anchor);
    labels.push({ name: it.name, lv, value: it.value, x: anchor.x, y: anchor.y, sel: isSel });

    /* 高亮区光柱：垂直于相机方位的立面 */
    if (it.beam) {
      const perp = { x: -camDir.y, y: camDir.x };
      const w = 16, top = h + 150;
      const a = P(it.lx + perp.x * w, it.ly + perp.y * w, h);
      const b = P(it.lx - perp.x * w, it.ly - perp.y * w, h);
      const c = P(it.lx - perp.x * w, it.ly - perp.y * w, top);
      const d = P(it.lx + perp.x * w, it.ly + perp.y * w, top);
      [a, b, c, d].forEach(track);
      beams.push({ d: `M${fmt(a)}L${fmt(b)}L${fmt(c)}L${fmt(d)}Z`, foot: { x: anchor.x, y: anchor.y } });
    }
  });

  const pad = 18;
  return {
    ground, walls, faces, edges, beams, labels,
    viewBox: `${(bx0 - pad).toFixed(1)} ${(by0 - pad).toFixed(1)} ${(bx1 - bx0 + pad * 2).toFixed(1)} ${(by1 - by0 + pad * 2).toFixed(1)}`,
    plan,
  };
}

/** 生成渐变与滤镜定义 */
function map3DDefs() {
  return `<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
  <path d="M18 0H0v18" fill="none" stroke="#3d83a9" stroke-opacity=".14" stroke-width="1"/></pattern>
  <filter id="contact" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00060d" flood-opacity="0.9"/></filter>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="175%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#bfe8ff" flood-opacity="0.5"/></filter>
  <filter id="glowOn" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b1"/>
    <feFlood flood-color="#8de5ff" flood-opacity=".95" result="c1"/>
    <feComposite in="c1" in2="b1" operator="in" result="g1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b2"/>
    <feFlood flood-color="#eaf8ff" flood-opacity=".9" result="c2"/>
    <feComposite in="c2" in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="wallGlow" x="-40%" y="-40%" width="180%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
    <feFlood flood-color="#5fd8ff" flood-opacity=".75" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="badge" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#1b4a72"/><stop offset="1" stop-color="#0a1c2e"/></linearGradient>
  <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ff7a4d" stop-opacity=".45"/>
    <stop offset="0.4" stop-color="#ff8f66" stop-opacity=".14"/>
    <stop offset="1" stop-color="#ff8f66" stop-opacity="0"/></linearGradient>
  <radialGradient id="beamFoot" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffb59f" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffb59f" stop-opacity="0"/></radialGradient>`;
}


const mapSvg = document.getElementById('mapSvg');
const defs = svg('defs', {});
defs.innerHTML = map3DDefs();
mapSvg.appendChild(defs);
const bgRect = svg('rect', { fill: 'rgba(4,13,24,.34)' });
const gridRect = svg('rect', { fill: 'url(#grid)', opacity: .5 });
mapSvg.appendChild(bgRect); mapSvg.appendChild(gridRect);

const gFloor = svg('g', {}), gGround = svg('g', {}), gWalls = svg('g', {}), gFaces = svg('g', {}),
      gEdges = svg('g', { class: 'sel-edges' }), gBeams = svg('g', { style: 'mix-blend-mode:screen' }),
      gLabels = svg('g', {});
mapSvg.appendChild(gFloor); mapSvg.appendChild(gGround); mapSvg.appendChild(gWalls); mapSvg.appendChild(gBeams);
mapSvg.appendChild(gFaces); mapSvg.appendChild(gEdges); mapSvg.appendChild(gLabels);

/* 按需生成配色渐变 */
const PALETTE = {
  risk: { top: TOP_GRAD, wall: WALL_GRAD },
  mono: { top: MONO_GRAD, wall: WALL_GRAD },
  height: { top: HEIGHT_GRAD, wall: WALL_GRAD },
};
let paletteKey = '';
function ensurePalette(mode){
  if (paletteKey === mode) return;
  paletteKey = mode;
  const set = PALETTE[mode];
  ['high','mid','low','zero'].forEach(k => {
    defs.insertAdjacentHTML('beforeend',
      `<linearGradient id="top-${mode}-${k}" x1="0.08" y1="0" x2="0.72" y2="1">
        <stop offset="0" stop-color="${set.top[k][0]}"/><stop offset="0.46" stop-color="${set.top[k][1]}"/>
        <stop offset="1" stop-color="${set.top[k][2]}"/></linearGradient>
      <linearGradient id="wall-${mode}-${k}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${set.wall[k][0]}"/><stop offset="1" stop-color="${set.wall[k][1]}"/></linearGradient>`);
  });
}

function levelOf(v){
  if (!v) return 'zero';
  return v >= 66 ? 'high' : v >= 34 ? 'mid' : 'low';
}
function valueOf(name){ return DATA[name]?.[state.metric] ?? 0; }

const LABEL_OFFSET = { '衢江区': [10, 6] };
let selected = null;

function currentItems(){
  const max = Math.max(1, ...Object.keys(DATA).map(valueOf));
  return BOUNDARIES.districts.map(d => {
    const v = valueOf(d.name);
    const m = DATA[d.name];
    const off = LABEL_OFFSET[d.name];
    return {
      name: d.name, rings: d.rings, value: v,
      h: Math.round(v * state.scale / 100),
      lv: levelOf(v),
      lx: off ? d.lx + off[0] : d.lx,
      ly: off ? d.ly + off[1] : d.ly,
      beam: state.beam && state.metric === 'index' && v >= 7,
    };
  });
}

function build(){
  ensurePalette(state.mode);
  const items = currentItems();
  const cam = { tilt: state.tilt, yaw: state.yaw, focal: state.focal };
  const model = buildMap3D(items, cam, selected);
  const cam3 = makeMapCamera(cam, model.plan);
  const P2 = (x, y) => cam3.P(x, y, 0);

  mapSvg.setAttribute('viewBox', model.viewBox);
  const vb = model.viewBox.split(' ').map(Number);
  [bgRect, gridRect].forEach(r => {
    r.setAttribute('x', vb[0]); r.setAttribute('y', vb[1]);
    r.setAttribute('width', vb[2]); r.setAttribute('height', vb[3]);
  });

  gFloor.replaceChildren(); gGround.replaceChildren(); gWalls.replaceChildren(); gFaces.replaceChildren();
  gEdges.replaceChildren(); gBeams.replaceChildren(); gLabels.replaceChildren();

  /* 三维地面网格：与地图同一投影的真实地平面 */
  if (state.floor) {
    const pl = model.plan, step = 40;
    for (let x = Math.ceil(pl.minX / step) * step; x <= pl.maxX; x += step) {
      const a = P2(x, pl.minY), b = P2(x, pl.maxY);
      gFloor.appendChild(svg('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: 'rgba(95,216,255,.13)', 'stroke-width': .8 }));
    }
    for (let y = Math.ceil(pl.minY / step) * step; y <= pl.maxY; y += step) {
      const a = P2(pl.minX, y), b = P2(pl.maxX, y);
      gFloor.appendChild(svg('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: 'rgba(95,216,255,.13)', 'stroke-width': .8 }));
    }
  }

  model.ground.forEach(g => {
    const p = svg('path', { d: g.d, fill: `url(#top-${state.mode}-${g.lv})`, 'fill-rule': 'evenodd',
      stroke: 'rgba(223,242,255,.55)', 'stroke-width': 1, 'stroke-opacity': .5 });
    p.dataset.name = g.name;
    p.addEventListener('click', ev => { ev.stopPropagation(); selected = selected === g.name ? null : g.name; build(); });
    gGround.appendChild(p);
  });

  model.walls.forEach(w => {
    const p = svg('path', { d: w.d, fill: `url(#wall-${state.mode}-${w.lv})`, stroke: 'none' });
    if (w.sel) { p.setAttribute('filter', 'url(#wallGlow)'); p.setAttribute('fill-opacity', '1'); }
    gWalls.appendChild(p);
  });

  model.faces.forEach(f => {
    const p = svg('path', { d: f.d, fill: `url(#top-${state.mode}-${f.lv})`, 'fill-rule': 'evenodd',
      stroke: f.sel ? '#eaf8ff' : '#dff2ff', 'stroke-width': f.sel ? 2.2 : 1.1,
      'stroke-opacity': f.sel ? 1 : .78, class: 'district face' });
    p.dataset.name = f.name;
    if (!f.sel) p.setAttribute('filter', 'url(#lift)');
    p.addEventListener('click', ev => { ev.stopPropagation(); selected = selected === f.name ? null : f.name; build(); });
    gFaces.appendChild(p);
  });

  model.edges.forEach(e => {
    const p = svg('path', { d: e.d, fill: 'none', stroke: e.dim ? 'rgba(140,220,255,.5)' : '#eaf8ff',
      'stroke-width': e.dim ? 1.5 : 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    p.setAttribute('filter', 'url(#glowOn)');
    gEdges.appendChild(p);
  });

  model.beams.forEach(b => {
    gBeams.appendChild(svg('ellipse', { cx: b.foot.x, cy: b.foot.y, rx: 26, ry: 8, fill: 'url(#beamFoot)' }));
    gBeams.appendChild(svg('path', { d: b.d, fill: 'url(#beamGrad)' }));
  });

  model.labels.forEach(l => {
    const w = 30, h = 20;
    gLabels.appendChild(svg('rect', { x: l.x - w / 2, y: l.y - h / 2 + 3, width: w, height: h, rx: 5, fill: 'rgba(2,8,14,.92)' }));
    gLabels.appendChild(svg('rect', { x: l.x - w / 2, y: l.y - h / 2, width: w, height: h, rx: 5,
      fill: 'url(#badge)', stroke: l.sel ? '#eaf8ff' : 'rgba(141,229,255,.7)', 'stroke-width': l.sel ? 1.6 : 1 }));
    const num = svg('text', { x: l.x, y: l.y + 4.5, 'text-anchor': 'middle', class: 'dnum-badge' });
    num.textContent = l.value;
    gLabels.appendChild(num);
    const nm = svg('text', { x: l.x, y: l.y + 19, 'text-anchor': 'middle', class: 'dname' });
    nm.textContent = l.name;
    gLabels.appendChild(nm);
  });

  syncUI();
}

/* ---------- 面板 ---------- */
const distTable = document.getElementById('distTable');
function renderInputs(){
  distTable.innerHTML = Object.keys(DATA).map(name => `
    <div class="dist-row"><span>${name}</span>
      <input type="number" min="0" max="99" value="${DATA[name][state.metric]}" data-name="${name}">
      <span class="h" id="h-${name}"></span></div>`).join('');
  distTable.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    DATA[inp.dataset.name][state.metric] = Math.max(0, Number(inp.value) || 0);
    build();
  }));
}
function syncUI(){
  const max = Math.max(1, ...Object.keys(DATA).map(valueOf));
  const maxName = Object.keys(DATA).reduce((a, b) => valueOf(a) >= valueOf(b) ? a : b, Object.keys(DATA)[0]);
  document.getElementById('metricName').textContent = METRIC_LABEL[state.metric];
  document.getElementById('scaleName').textContent = (state.scale / 10).toFixed(1);
  document.getElementById('maxName').textContent = maxName;
  document.getElementById('tiltBadge').textContent = state.tilt >= 70 ? `平侧视 ${state.tilt}°`
    : state.tilt >= 40 ? `侧视 ${state.tilt}°` : state.tilt ? `斜俯视 ${state.tilt}°` : '正俯视';
  document.getElementById('legendTitle').textContent = METRIC_LABEL[state.metric];

  const maxVal = max;
  document.getElementById('legendBox').innerHTML = `
    <div><i style="background:${TOP_GRAD.high[1]}"></i>最高<b>66–100</b></div>
    <div><i style="background:${TOP_GRAD.mid[1]}"></i>中<b>34–65</b></div>
    <div><i style="background:${TOP_GRAD.low[1]}"></i>低<b>1–33</b></div>
    <div><i style="background:${TOP_GRAD.zero[1]}"></i>无<b>0</b></div>`;

  document.getElementById('readout').innerHTML = Object.keys(DATA).map(name => {
    const v = valueOf(name);
    const h = Math.round(v * state.scale / 100);
    return `<div><span class="k">${name}</span><span class="v ${v >= maxVal * 0.66 ? 'hot' : ''}">${v}</span>
      <span class="u">浮起 ${h} 单位${v >= maxVal * 0.66 ? ' · 最重' : ''}</span></div>`;
  }).join('');

  document.getElementById('radar').style.display = state.radar ? '' : 'none';
  document.getElementById('pillar').style.display = state.pillar === false ? 'none' : '';
  gridRect.setAttribute('opacity', state.grid ? .5 : 0);
  gGround.style.display = state.base ? '' : 'none';
  gWalls.style.display = state.base ? '' : 'none';
  gBeams.style.display = state.beam ? '' : 'none';
}

const bind = (id, key, type) => {
  const el = document.getElementById(id);
  el.addEventListener(type === 'range' ? 'input' : 'change', () => {
    state[key] = type === 'range' ? Number(el.value) : (el.type === 'checkbox' ? el.checked : el.value);
    if (key === 'metric') renderInputs();
    build();
  });
};
bind('metric','metric','change'); bind('scale','scale','range'); bind('mode','mode','change');
bind('tilt','tilt','change'); bind('dir','dir','change'); bind('yaw','yaw','range');
['layBase|base','layBadge|badge','layName|name','layBeam|beam','layRadar|radar',
 'layFloor|floor','layGrid|grid'].forEach(pair => {
  const [id, key] = pair.split('|');
  bind(id, key, 'change');
});

document.getElementById('btnRandom').addEventListener('click', () => {
  DATA = {};
  Object.keys(REAL).forEach(name => {
    DATA[name] = { index: 0, hazards: 0, overdue: 0, high: 0, pending: 0 };
    DATA[name][state.metric] = Math.floor(Math.random() * 18);
  });
  renderInputs(); build();
});
document.getElementById('btnReset').addEventListener('click', () => {
  DATA = JSON.parse(JSON.stringify(REAL)); renderInputs(); build();
});
document.getElementById('btnCopy').addEventListener('click', async () => {
  const text = JSON.stringify({ state, data: DATA }, null, 2);
  try { await navigator.clipboard.writeText(text); } catch { console.log(text); }
  const btn = document.getElementById('btnCopy');
  btn.textContent = '已复制配置';
  setTimeout(() => { btn.textContent = '复制当前配置'; }, 1400);
});

mapSvg.addEventListener('click', () => { selected = null; build(); });
window.addEventListener('resize', () => build());

/* URL 预设：?tilt=32&metric=overdue&scale=30&mode=mono */
const QUERY = new URLSearchParams(location.search);
['metric','mode','dir'].forEach(k => { if (QUERY.has(k)) { state[k] = QUERY.get(k); document.getElementById(k === 'metric' ? 'metric' : k).value = state[k]; } });
if (QUERY.has('tilt')) { state.tilt = Number(QUERY.get('tilt')); document.getElementById('tilt').value = String(state.tilt); }
if (QUERY.has('yaw')) { state.yaw = Number(QUERY.get('yaw')); document.getElementById('yaw').value = String(state.yaw); }
if (QUERY.get('sel')) selected = QUERY.get('sel');
if (QUERY.has('scale')) { state.scale = Number(QUERY.get('scale')); document.getElementById('scale').value = String(state.scale); }
document.getElementById('tilt').value = String(state.tilt);
document.getElementById('yaw').value = String(state.yaw);
renderInputs();
build();
</script>
