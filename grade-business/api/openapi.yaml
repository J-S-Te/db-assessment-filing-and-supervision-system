---
openapi: 3.0.3
info:
  title: 等保管理端业务接口
  version: 1.32.0
servers:
- url: "/api/v1"
paths:
  "/archives/suppliers":
    get:
      operationId: listArchiveSuppliers
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArchiveSupplier"
                  nextCursor:
                    type: string
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
    post:
      operationId: createArchiveSupplier
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArchiveSupplier"
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArchiveSupplier"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - serviceType
              - source
              properties:
                name:
                  type: string
                  maxLength: 200
                serviceType:
                  type: string
                  maxLength: 120
                unitId:
                  type: string
                  format: uuid
                startedOn:
                  type: string
                  format: date
                contactName:
                  type: string
                  maxLength: 120
                contactPhone:
                  type: string
                  maxLength: 80
                source:
                  type: string
                  maxLength: 300
                active:
                  type: boolean
  "/archives/suppliers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getArchiveSupplier
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - supplier
                - systems
                properties:
                  supplier:
                    "$ref": "#/components/schemas/ArchiveSupplier"
                  systems:
                    type: object
                    additionalProperties: false
                    required:
                    - items
                    properties:
                      items:
                        type: array
                        items:
                          "$ref": "#/components/schemas/ArchiveSupplierSystem"
                      nextCursor:
                        type: string
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
    patch:
      operationId: updateArchiveSupplier
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArchiveSupplier"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - serviceType
              - source
              - active
              properties:
                name:
                  type: string
                  maxLength: 200
                serviceType:
                  type: string
                  maxLength: 120
                unitId:
                  type: string
                  format: uuid
                startedOn:
                  type: string
                  format: date
                contactName:
                  type: string
                  maxLength: 120
                contactPhone:
                  type: string
                  maxLength: 80
                source:
                  type: string
                  maxLength: 300
                active:
                  type: boolean
  "/dashboard/analytics":
    get:
      operationId: getDashboardAnalytics
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardAnalytics"
        default:
          "$ref": "#/components/responses/Error"
  "/dashboard/classifications/{kind}":
    parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - industry
        - issue
    get:
      operationId: listDashboardClassifications
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardClassificationPage"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
  "/dashboard/classifications/{kind}/{id}":
    parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - industry
        - issue
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateDashboardClassification
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - version
                properties:
                  code:
                    type: string
                    maxLength: 48
                  version:
                    type: integer
                    format: int64
                    minimum: 0
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              - expectedVersion
              properties:
                code:
                  type: string
                  maxLength: 48
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 0
  "/knowledge/{id}/clauses":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listKnowledgeClauses
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - knowledgeVersion
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/KnowledgeClause"
                  knowledgeVersion:
                    type: integer
                    format: int64
                    minimum: 1
                  nextAfter:
                    type: string
                    maxLength: 48
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
          maxLength: 48
    post:
      operationId: saveKnowledgeClause
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgeClause"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requestId
              - knowledgeVersion
              - number
              - expectedVersion
              - text
              - active
              properties:
                requestId:
                  type: string
                  format: uuid
                knowledgeVersion:
                  type: integer
                  format: int64
                  minimum: 1
                number:
                  type: string
                  maxLength: 48
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 0
                text:
                  type: string
                  maxLength: 4000
                active:
                  type: boolean
  "/reports/{id}/compliance/clause-candidates":
    get:
      operationId: listReportClauseCandidates
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - hasMore
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - title
                      - source
                      - version
                      - inOriginal
                      - inCorrected
                      - clause
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        source:
                          type: string
                        version:
                          type: integer
                          format: int64
                          minimum: 1
                        inOriginal:
                          type: boolean
                        inCorrected:
                          type: boolean
                        clause:
                          "$ref": "#/components/schemas/KnowledgeClauseSnapshot"
                    maxItems: 20
                  hasMore:
                    type: boolean
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: extractionVersion
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: fieldKey
        in: query
        required: true
        schema:
          type: string
          enum:
          - assets
          - findings
          - risk
          - recommendations
  "/archives/systems/{id}/assets":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSystemAssetRegistrations
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SystemAssetRegistration"
                  nextCursor:
                    type: string
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - ip
          - domain
          - topology
          - supplier
          - security_event
          - cloud
          - big_data
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
    post:
      operationId: createSystemAssetRegistration
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SystemAssetRegistration"
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SystemAssetRegistration"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - kind
              - source
              properties:
                supplierId: {type: string, format: uuid}
                kind:
                  type: string
                  enum:
                  - ip
                  - domain
                  - topology
                  - supplier
                  - security_event
                  - cloud
                  - big_data
                identifier:
                  type: string
                  maxLength: 253
                relatedEndpoint:
                  type: string
                  maxLength: 253
                label:
                  type: string
                  maxLength: 200
                source:
                  type: string
                  maxLength: 300
                description:
                  type: string
                  maxLength: 2000
                occurredOn:
                  type: string
                  maxLength: 10
  "/archives/systems/{id}/assets/{assetId}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateSystemAssetRegistration
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SystemAssetRegistration"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - source
              - active
              properties:
                supplierId: {type: string, format: uuid}
                label:
                  type: string
                  maxLength: 200
                source:
                  type: string
                  maxLength: 300
                description:
                  type: string
                  maxLength: 2000
                occurredOn:
                  type: string
                  maxLength: 10
                active:
                  type: boolean
  "/archives/coverage-targets":
    get:
      operationId: listFilingCoverageTargets
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/FilingCoverageTarget"
                  nextCursor:
                    type: string
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
    post:
      operationId: createFilingCoverageTarget
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FilingCoverageTarget"
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FilingCoverageTarget"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - unitId
              - systemName
              - reference
              - source
              properties:
                unitId:
                  type: string
                  format: uuid
                filingId:
                  type: string
                  format: uuid
                systemName:
                  type: string
                  maxLength: 200
                reference:
                  type: string
                  maxLength: 120
                source:
                  type: string
                  maxLength: 300
  "/archives/coverage-targets/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateFilingCoverageTarget
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FilingCoverageTarget"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - active
              properties:
                filingId:
                  type: string
                  format: uuid
                active:
                  type: boolean
  "/filings":
    get:
      operationId: listFilings
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/FilingRow"
                  nextCursor:
                    type: string
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/Status"
      - name: lifecycle
        in: query
        schema:
          type: string
          enum: [active, cancelled]
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: createFiling
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Mutation"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FilingInput"
  "/filings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getFiling
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FilingDetail"
        default:
          "$ref": "#/components/responses/Error"
    patch:
      operationId: updateFiling
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Mutation"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FilingEdit"
  "/filings/{id}/submit":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: submitFiling
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Mutation"
        '409':
          "$ref": "#/components/responses/MaterialSubmissionConflict"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Submit"
  "/filings/{id}/review-actions":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reviewFiling
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Mutation"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Review"
  "/filings/{id}/review-history":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: readFilingHistory
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Event"
        default:
          "$ref": "#/components/responses/Error"
  "/filings/{id}/attachments":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listFilingAttachments
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Attachment"
        default:
          "$ref": "#/components/responses/Error"
    post:
      operationId: uploadFilingAttachment
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Attachment"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              - kind
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum:
                  - filing_form
                  - classification_report
                  - supporting
  "/filings/{id}/attachments/{attachmentId}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: downloadFilingAttachment
      responses:
        '200':
          description: 业务操作结果
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/Error"
        '206':
          description: 指定字节范围的材料
  "/filings/{id}/attachments/{attachmentId}/text":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getFilingMaterialText
      summary: 读取备案 Word 原件或已登记备案材料包的正文及表格文字
      responses:
        '200':
          description: 按材料与章节组织的原件文字
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/FilingTextDocument"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
  "/reports":
    get:
      operationId: listReports
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ReportRow"
                  nextCursor:
                    type: string
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/Status"
      - name: risk
        in: query
        schema:
          type: string
          enum: [low, medium, high]
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: createReport
      responses:
        '201':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Mutation"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReportInput"
  "/reports/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getReport
      responses:
        '200':
          description: 业务操作结果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportDetail"
