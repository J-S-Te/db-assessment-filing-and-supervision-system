        '409':
          description: 版本冲突或合并后的附件数量及容量超过限制
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: 文件或上传请求超过容量
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        default:
          "$ref": "#/components/responses/Error"
