    post:
      operationId: uploadInstitutionReportAttachment
      description: 文件验证失败后登记材料异常，同一报告同一类别只保留一条待补正异常。绑定 issueId 重发时核对当前报告、材料类别与异常状态，成功登记材料后关闭对应异常。
      parameters:
      - "$ref": "#/components/parameters/MaterialUploadKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - kind
              - file
              properties:
                kind:
                  type: string
                  enum:
                  - report_file
                  - remediation_plan
                  - assessment_conclusion
                  - issues_recommendations
                  - cover_basic_statement
                  - cloud_extension
                  - big_data_extension
                  - major_risk_recommendations
                  - supporting
                file:
                  type: string
                  format: binary
                issueId:
                  type: string
                  format: uuid
                  description: 当前要补正的材料异常标识
      responses:
        '201':
          description: 已登记的补正附件
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Attachment"
        '400':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
    get:
      operationId: listInstitutionReportAttachments
      responses:
        '200':
