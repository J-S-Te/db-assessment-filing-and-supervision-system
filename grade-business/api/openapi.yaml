  "/dashboard/risk-by-district":
    get:
      operationId: getDashboardRiskByDistrict
      description: 按当前备案单位名录区县统计已派发、未销项隐患。高风险数优先，同数按逾期数排序。逾期按北京时间日期计算。缺失区县、超出上限单列。
      responses:
        '200':
          description: 区县风险分布
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, withoutDistrict, omittedDistricts]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      "$ref": "#/components/schemas/DashboardDistrictRisk"
                  omittedDistricts: {type: integer, minimum: 0}
                  withoutDistrict:
                    "$ref": "#/components/schemas/DashboardDistrictRiskCounts"
        default:
          "$ref": "#/components/responses/Error"
      parameters: [{name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}]
