    get:
      operationId: getDashboardDistrictResponse
      description: 按选定范围读取风险和待办。传 district 时同时返回同一快照的整屏统计、概览和分类分析。必须且只能传 district 或 scope 之一。
      parameters:
        - name: district
          in: query
          required: false
          allowEmptyValue: true
          description: 区县名称。显式空值表示未归区。
          schema: {type: string, maxLength: 200}
        - name: scope
          in: query
          required: false
          description: all 表示全域，包含未归区记录。
          schema: {type: string, enum: [all]}
      responses:
        '200':
          description: 所选范围的处置态势
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardDistrictResponse"
        default:
          "$ref": "#/components/responses/Error"
