      description: 校验整批附件后建立草稿修订。已存在的同名同内容文件复用，相同批次无实际变化时沿用当前版本。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, files]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                  format: int64
                files:
                  type: array
                  minItems: 1
                  maxItems: 8
                  description: PDF 或 DOCX。单文件最多 20 MiB，同版本最多 8 件、合计 40 MiB。
                  items: {type: string, format: binary}
            encoding:
              files:
                contentType: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document
