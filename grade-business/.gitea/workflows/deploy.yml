name: Build and Deploy Go App
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-vm
    steps:
      - name: 构建并发布前后端
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          repository="${GITHUB_SERVER_URL%/}/$GITHUB_REPOSITORY.git"
          git init -q "$work/source"
          git -C "$work/source" fetch -q --depth=1 "$repository" "$GITHUB_SHA"
          git -C "$work/source" checkout -q --detach FETCH_HEAD
          cd "$work/source"
          mkdir "$work/artifacts"

          export GOPROXY=https://goproxy.cn,direct
          export GOTOOLCHAIN=auto
          go build -trimpath -o "$work/artifacts/grade-business" ./cmd/manager

          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          if ! command -v node >/dev/null || ! command -v corepack >/dev/null ||
            [[ "$(node --version)" != v24.* ]]; then
            version=24.18.0
            case "$(uname -m)" in
              x86_64)
                arch=x64
                sha256=783130984963db7ba9cbd01089eaf2c2efb055c7c1693c943174b967b3050cb8 ;;
              aarch64)
                arch=arm64
                sha256=6b4484c2190274175df9aa8f28e2d758a819cb1c1fe6ab481e2f95b463ab8508 ;;
              *)
                echo 'Runner 架构没有可用的 Node.js 构建包' >&2
                exit 1 ;;
            esac
            archive="node-v$version-linux-$arch.tar.gz"
            found=false
            cached="${GRADE_RELEASE_NODE_CACHE:-/opt/grade-business/.ci-cache/node}/$archive"
            if [[ -r "$cached" ]] && cp -- "$cached" "$work/$archive" &&
              printf '%s  %s\n' "$sha256" "$work/$archive" | sha256sum --check --status; then
              echo '已校验并复用 Node.js 发布缓存'
              found=true
            fi
            if [[ "$found" != true ]]; then
              for base in https://nodejs.org/dist https://registry.npmmirror.com/-/binary/node; do
                if curl -4fsSL --retry 1 --retry-all-errors --connect-timeout 8 --max-time 180 \
                  "$base/v$version/$archive" -o "$work/$archive" &&
                  printf '%s  %s\n' "$sha256" "$work/$archive" | sha256sum --check --status; then
                  found=true
                  break
                fi
              done
            fi
            if [[ "$found" != true ]]; then
              echo 'Node.js 下载失败或 SHA-256 校验失败' >&2
              exit 1
            fi
            tar -xzf "$work/$archive" -C "$work"
            export PATH="$work/node-v$version-linux-$arch/bin:$PATH"
          fi
          (
            cd web
            export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--dns-result-order=ipv4first"
            corepack pnpm install --frozen-lockfile
            corepack pnpm build --outDir "$work/artifacts/web"
          )

          gitea_host=${GITHUB_SERVER_URL#*://}
          gitea_host=${gitea_host%%[:/]*}
          release=(bash deploy/ubuntu.sh "$work/artifacts" "$GITHUB_SHA" "$gitea_host" "$repository")
          if (( EUID == 0 )); then
            "${release[@]}"
          else
            sudo -n "${release[@]}"
          fi
